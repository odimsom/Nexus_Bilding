<!-- @dsCard group="Components" viewport="700x430" name="Core — buttons, inputs, toggles" subtitle="Button, IconButton, Input, Select, Checkbox, Switch, Badge, Tag, Avatar" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--surface); padding: 24px; }
  .wrap { display: flex; flex-direction: column; gap: 20px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; align-items: end; }
  .sec { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 10px; }
  .block { border-top: 1px solid var(--border-subtle); padding-top: 16px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { Button, IconButton, Input, Select, Checkbox, Switch, Badge, Tag, Avatar } = window.NexusBillingDesignSystem_f29fd0;
    const I = ({ n }) => <i data-lucide={n}></i>;

    function Demo() {
      return (
        <div className="wrap">
          <div>
            <div className="sec">Buttons</div>
            <div className="row">
              <Button variant="primary" leftIcon={<I n="plus" />}>New invoice</Button>
              <Button variant="secondary">Cancel</Button>
              <Button variant="subtle">Post</Button>
              <Button variant="ghost" leftIcon={<I n="sliders-horizontal" />}>Filter</Button>
              <Button variant="danger" leftIcon={<I n="trash-2" />}>Delete</Button>
              <Button variant="secondary" disabled>Disabled</Button>
              <IconButton label="More"><I n="ellipsis" /></IconButton>
            </div>
          </div>

          <div className="block">
            <div className="sec">Form controls</div>
            <div className="grid2">
              <Input label="Customer name" placeholder="Search customers…" />
              <Input label="Unit price" mono adornment={<span>RD$</span>} defaultValue="1,240.00" />
              <Select label="Document type" options={['Invoice','Credit Memo','Quote']} />
              <Input label="Email" error="Enter a valid email" defaultValue="bad@" />
            </div>
            <div className="row" style={{ marginTop: 16 }}>
              <Checkbox label="Blocked" defaultChecked />
              <Checkbox radio name="ib" label="Balance Sheet" defaultChecked />
              <Checkbox radio name="ib" label="Income Statement" />
              <Switch label="Show open only" defaultChecked />
            </div>
          </div>

          <div className="block">
            <div className="sec">Badges · tags · avatars</div>
            <div className="row">
              <Badge status="success" dot>Posted</Badge>
              <Badge status="info" dot>Open</Badge>
              <Badge status="warn" dot>Pending</Badge>
              <Badge status="danger" dot>Overdue</Badge>
              <Badge>Draft</Badge>
              <Badge solid>Released</Badge>
              <Tag onRemove={() => {}}>City: Santo Domingo</Tag>
              <Tag>Posted</Tag>
              <Avatar name="Altagracia Comercial" />
              <Avatar name="José Ramírez" shape="circle" size="sm" />
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
    setTimeout(() => window.lucide && window.lucide.createIcons(), 60);
  </script>
</body>
</html>
