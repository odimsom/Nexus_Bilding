<!-- @dsCard group="Components" viewport="700x330" name="Feedback — banners, empty, tooltip" subtitle="Banner (4 statuses), EmptyState, Tooltip" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--surface); padding: 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
  .banners { display: flex; flex-direction: column; gap: 10px; }
  .tip { display:flex; align-items:center; gap:10px; margin-top:14px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { Banner, EmptyState, Button } = window.NexusBillingDesignSystem_f29fd0;
    const I = ({ n }) => <i data-lucide={n}></i>;
    function Demo() {
      return (
        <div className="grid">
          <div className="banners">
            <Banner status="success" title="Invoice posted" onDismiss={()=>{}}>SI-2026-001847 posted to the ledger.</Banner>
            <Banner status="warn" title="3 documents pending approval" />
            <Banner status="danger" title="Posting failed">Period 2026-05 is closed.</Banner>
            <div className="tip">
              <span className="nx-tooltip">Drill to customer ledger</span>
              <span style={{fontSize:12, color:'var(--text-muted)'}}>← .nx-tooltip</span>
            </div>
          </div>
          <div className="nx-card">
            <EmptyState
              icon={<I n="file-text" />}
              title="No open invoices"
              action={<Button variant="primary" leftIcon={<I n="plus" />}>New invoice</Button>}>
              Documents you create will appear here.
            </EmptyState>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
    setTimeout(() => window.lucide && window.lucide.createIcons(), 60);
  </script>
</body>
</html>
