<!-- @dsCard group="Colors" viewport="700x180" name="Brand — Ledger Emerald" subtitle="Primary action & positive signal; --emerald-50…900" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background: var(--surface); padding: 22px; font-family: var(--font-sans); }
  .ramp { display: grid; grid-template-columns: repeat(10, 1fr); gap: 0; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-subtle); }
  .sw { aspect-ratio: 1 / 1.15; display: flex; align-items: flex-end; padding: 8px; }
  .sw span { font-family: var(--font-mono); font-size: 10px; font-weight: 500; }
  .meta { display:flex; justify-content: space-between; margin-top: 12px; font-size: 12px; color: var(--text-muted); }
  .meta b { color: var(--text-strong); font-weight: 600; }
  .chip { font-family: var(--font-mono); }
</style></head>
<body>
  <div class="ramp">
    <div class="sw" style="background:var(--emerald-50)"><span style="color:var(--emerald-700)">50</span></div>
    <div class="sw" style="background:var(--emerald-100)"><span style="color:var(--emerald-700)">100</span></div>
    <div class="sw" style="background:var(--emerald-200)"><span style="color:var(--emerald-800)">200</span></div>
    <div class="sw" style="background:var(--emerald-300)"><span style="color:var(--emerald-900)">300</span></div>
    <div class="sw" style="background:var(--emerald-400)"><span style="color:#fff">400</span></div>
    <div class="sw" style="background:var(--emerald-500)"><span style="color:#fff">500</span></div>
    <div class="sw" style="background:var(--emerald-600)"><span style="color:#fff">600</span></div>
    <div class="sw" style="background:var(--emerald-700)"><span style="color:#fff">700</span></div>
    <div class="sw" style="background:var(--emerald-800)"><span style="color:#fff">800</span></div>
    <div class="sw" style="background:var(--emerald-900)"><span style="color:#fff">900</span></div>
  </div>
  <div class="meta"><span><b>Action</b> = <span class="chip">--emerald-600</span> · hover <span class="chip">700</span> · tint <span class="chip">50</span></span><span>Money-positive · success</span></div>
</body></html>
