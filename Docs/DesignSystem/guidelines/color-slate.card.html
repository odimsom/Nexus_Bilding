<!-- @dsCard group="Colors" viewport="700x180" name="Neutral — Slate" subtitle="Canvas, surfaces, text & borders; --slate-0…950" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background: var(--surface); padding: 22px; font-family: var(--font-sans); }
  .ramp { display: grid; grid-template-columns: repeat(12, 1fr); gap: 0; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-subtle); }
  .sw { aspect-ratio: 1 / 1.25; display: flex; align-items: flex-end; padding: 6px; }
  .sw span { font-family: var(--font-mono); font-size: 9px; font-weight: 500; }
  .meta { display:flex; justify-content: space-between; margin-top: 12px; font-size: 12px; color: var(--text-muted); }
  .meta b { color: var(--text-strong); font-weight: 600; }
  .chip { font-family: var(--font-mono); }
</style></head>
<body>
  <div class="ramp">
    <div class="sw" style="background:var(--slate-0); box-shadow: inset 0 0 0 1px var(--border-subtle)"><span style="color:var(--slate-500)">0</span></div>
    <div class="sw" style="background:var(--slate-25)"><span style="color:var(--slate-500)">25</span></div>
    <div class="sw" style="background:var(--slate-50)"><span style="color:var(--slate-500)">50</span></div>
    <div class="sw" style="background:var(--slate-100)"><span style="color:var(--slate-500)">100</span></div>
    <div class="sw" style="background:var(--slate-150)"><span style="color:var(--slate-600)">150</span></div>
    <div class="sw" style="background:var(--slate-200)"><span style="color:var(--slate-600)">200</span></div>
    <div class="sw" style="background:var(--slate-300)"><span style="color:var(--slate-700)">300</span></div>
    <div class="sw" style="background:var(--slate-400)"><span style="color:#fff">400</span></div>
    <div class="sw" style="background:var(--slate-500)"><span style="color:#fff">500</span></div>
    <div class="sw" style="background:var(--slate-600)"><span style="color:#fff">600</span></div>
    <div class="sw" style="background:var(--slate-700)"><span style="color:#fff">700</span></div>
    <div class="sw" style="background:var(--slate-900)"><span style="color:#fff">900</span></div>
  </div>
  <div class="meta"><span><b>Text</b> <span class="chip">900/800/500</span> · <b>Borders</b> <span class="chip">150/200</span> · <b>Canvas</b> <span class="chip">50</span></span><span>Sidebar &amp; chrome <span class="chip">900</span></span></div>
</body></html>
