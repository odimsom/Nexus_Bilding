<!-- @dsCard group="Type" viewport="700x220" name="UI & body — Hanken Grotesk" subtitle="14px base; labels, body, captions, eyebrow" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background: var(--surface); padding: 26px; font-family: var(--font-sans); color: var(--text-body); }
  .stack { display:flex; flex-direction: column; gap: 14px; }
  .ln { display:flex; align-items: baseline; gap: 16px; }
  .tag { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); white-space: nowrap; }
  .eyebrow { font-weight: 600; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); }
  .title { font-size: 19px; font-weight: 600; color: var(--text-strong); }
  .body { font-size: 14px; line-height: 1.5; max-width: 52ch; }
  .cap { font-size: 12px; color: var(--text-muted); }
</style></head>
<body>
  <div class="stack">
    <div class="ln"><span class="eyebrow">Customer Card</span><span class="tag">eyebrow · xs/600/caps</span></div>
    <div class="ln"><span class="title">Altagracia Comercial, S.R.L.</span><span class="tag">xl / 600</span></div>
    <div class="ln"><span class="body">Every record links to its related entries — open the customer to reach its sales, ledger and statistics without losing your place.</span></div>
    <div class="ln"><span class="cap">Last posted 11 Jun 2026 · Balance due RD$ 84,120.00</span><span class="tag">caption · xs</span></div>
  </div>
</body></html>
