<!-- @dsCard group="Type" viewport="700x200" name="Display — Space Grotesk" subtitle="Brand wordmark & page/KPI display, tight tracking" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background: var(--surface); padding: 26px; }
  .stack { display:flex; flex-direction: column; gap: 16px; }
  .ln { display:flex; align-items: baseline; gap: 16px; border-bottom: 1px solid var(--border-subtle); padding-bottom: 14px; }
  .ln:last-child { border: none; padding-bottom: 0; }
  .spec { font-family: var(--font-display); color: var(--text-strong); letter-spacing: -0.02em; line-height: 1.1; }
  .tag { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); white-space: nowrap; }
</style></head>
<body>
  <div class="stack">
    <div class="ln"><span class="spec" style="font-size: 40px; font-weight: 700;">Statements at a glance</span><span class="tag">4xl / 700</span></div>
    <div class="ln"><span class="spec" style="font-size: 31px; font-weight: 700; font-family: var(--font-mono); font-variant-numeric: tabular-nums;">$ 1,284,902.50</span><span class="tag">KPI · mono</span></div>
    <div class="ln"><span class="spec" style="font-size: 24px; font-weight: 600;">Sales Invoices — Open</span><span class="tag">2xl / 600</span></div>
  </div>
</body></html>
