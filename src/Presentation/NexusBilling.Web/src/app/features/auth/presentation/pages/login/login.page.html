<div class="login-container">
  <div class="glass-card">
    <div class="login-header">
      <img src="assets/logo.svg" alt="NexusBilling Logo" class="logo">
      <h1>NexusBilling</h1>
      <p class="subtitle">Enterprise Resource Planning</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-field">
        <label for="email">Correo Electrónico</label>
        <div class="input-wrapper">
          <i class="icon-email"></i>
          <input id="email" type="email" formControlName="email" placeholder="nombre@empresa.com">
        </div>
      </div>

      <div class="form-field">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <i class="icon-lock"></i>
          <input id="password" type="password" formControlName="password" placeholder="••••••••">
        </div>
      </div>

      <div *ngIf="error()" class="error-message">
        {{ error() }}
      </div>

      <button type="submit" [disabled]="loginForm.invalid || isLoading()" class="btn-login">
        <span *ngIf="!isLoading()">Entrar al Sistema</span>
        <div *ngIf="isLoading()" class="loader"></div>
      </button>

      <div class="login-footer">
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>
    </form>
  </div>
</div>
